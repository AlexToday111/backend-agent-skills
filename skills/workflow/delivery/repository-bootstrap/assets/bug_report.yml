{
  "name": "Bug report",
  "description": "Report a reproducible defect.",
  "body": [
    {
      "type": "textarea",
      "id": "reproduction",
      "attributes": {
        "label": "Steps to reproduce"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "expected",
      "attributes": {
        "label": "Expected behavior"
      },
      "validations": {
        "required": false
      }
    },
    {
      "type": "textarea",
      "id": "actual",
      "attributes": {
        "label": "Actual behavior"
      },
      "validations": {
        "required": false
      }
    },
    {
      "type": "textarea",
      "id": "environment",
      "attributes": {
        "label": "Environment and versions"
      },
      "validations": {
        "required": false
      }
    }
  ]
}
